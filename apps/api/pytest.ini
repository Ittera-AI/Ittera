[pytest]
testpaths = tests
asyncio_default_fixture_loop_scope = function
# Fail a hung test fast (with a traceback) instead of blocking the whole suite.
timeout = 60
timeout_method = thread
# Make the suite hermetic: block real network I/O so any un-mocked outbound call
# (scrapers, LinkedIn/Twitter/Supabase, SMTP) fails immediately instead of hanging.
# Loopback is allowed; FastAPI's TestClient uses an in-process ASGI transport and
# is unaffected. Add --allow-hosts entries here if a test needs a local service.
addopts = --disable-socket --allow-hosts=127.0.0.1,::1
filterwarnings =
    ignore::DeprecationWarning
