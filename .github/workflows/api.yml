name: API & AI Engine CI

on:
  push:
    paths:
      - "apps/api/**"
      - "packages/ai-engine/**"
      - "packages/shared-types/**"
      - "scripts/**"
      - "workers/**"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "packages/ai-engine/**"
      - "packages/shared-types/**"
      - "scripts/**"
      - "workers/**"
      - ".github/workflows/api.yml"

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: iterra
          POSTGRES_PASSWORD: iterra
          POSTGRES_DB: iterra_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            apps/api/requirements-dev.txt
            packages/ai-engine/pyproject.toml

      - name: Install AI engine
        run: pip install -e packages/ai-engine/

      - name: Install API dependencies
        run: pip install -r apps/api/requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check apps/api/
          ruff check packages/ai-engine/

      - name: Verify PostgreSQL migration cycle
        env:
          DATABASE_URL: postgresql://iterra:iterra@localhost:5432/iterra_test
          SECRET_KEY: test-secret-key
          OPENAI_API_KEY: sk-test
        run: |
          cd apps/api
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head
          python -m alembic current
          python -c 'import os; from alembic.config import Config; from alembic.runtime.migration import MigrationContext; from alembic.script import ScriptDirectory; from sqlalchemy import create_engine; config = Config("alembic.ini"); engine = create_engine(os.environ["DATABASE_URL"]); connection = engine.connect(); actual = set(MigrationContext.configure(connection).get_current_heads()); expected = set(ScriptDirectory.from_config(config).get_heads()); connection.close(); engine.dispose(); assert actual == expected, f"database heads {sorted(actual)} != script heads {sorted(expected)}"'

      - name: Test Temporal readiness conformance
        env:
          SECRET_KEY: test-secret-key
          OPENAI_API_KEY: sk-test
        run: |
          cd apps/api
          pytest tests/temporal_readiness -v

      - name: Run complete API suite and report legacy baseline coverage
        env:
          DATABASE_URL: postgresql://iterra:iterra@localhost:5432/iterra_test
          POSTGRES_TEST_DATABASE_URL: postgresql://iterra:iterra@localhost:5432/iterra_test
          SECRET_KEY: test-secret-key
          OPENAI_API_KEY: sk-test
        run: |
          cd apps/api
          # Temporal has its own step above; all remaining API tests run here.
          pytest tests/ --ignore=tests/temporal_readiness --cov=app --cov-report=term-missing

      - name: Enforce A1 safety-module coverage
        env:
          DATABASE_URL: postgresql://iterra:iterra@localhost:5432/iterra_test
          POSTGRES_TEST_DATABASE_URL: postgresql://iterra:iterra@localhost:5432/iterra_test
          SECRET_KEY: test-secret-key
          OPENAI_API_KEY: sk-test
        run: |
          cd apps/api
          # Keep the 60% requirement on the A1-owned safety surface while the
          # complete suite above reports (but does not disguise) legacy app debt.
          pytest -q \
            tests/test_route_contracts.py \
            tests/test_workspace_authorization.py \
            tests/test_approval_authorization.py \
            tests/test_supabase_provisioning.py \
            tests/postgres/test_a1_postgres.py \
            --cov=main \
            --cov=app.core.permissions \
            --cov=app.dependencies.auth \
            --cov=app.dependencies.workspace \
            --cov=app.routers.approvals \
            --cov=app.services.approval_service \
            --cov-report=term-missing \
            --cov-fail-under=60

      - name: Run all AI tests and report whole-package coverage
        run: |
          cd packages/ai-engine
          python -m pytest tests/ --cov=iterra_ai --cov-report=term-missing

      - name: Enforce 60% aggregate coverage on tested AI engines
        run: |
          cd packages/ai-engine
          # The full suite above reports total package debt. This separate gate
          # covers only engines with direct behavioral tests in this package.
          python -m coverage report \
            --show-missing \
            --fail-under=60 \
            iterra_ai/calendar/engine.py \
            iterra_ai/coach/engine.py \
            iterra_ai/insight/engine.py \
            iterra_ai/radar/engine.py \
            iterra_ai/repurpose/engine.py

      - name: Set up Node 20 (OpenAPI typegen)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify shared-types match offline OpenAPI
        env:
          SECRET_KEY: test-secret-key
          OPENAI_API_KEY: sk-test
        run: |
          bash scripts/gen_types.sh
          git diff --exit-code -- \
            packages/shared-types/openapi.json \
            packages/shared-types/src/index.ts
