# Template for the ConfigMap (non-secret runtime config) and Secret (credentials)
# referenced by the api/worker/web deployments.
#
# DO NOT commit real production values. This file is an example only — production
# secrets MUST be supplied from an environment-specific secret store (e.g. a
# sealed-secrets controller, External Secrets Operator, or `kubectl create secret`
# from a vault) so that no production credential lives in the repository (R12.6).
apiVersion: v1
kind: ConfigMap
metadata:
  name: iterra-config
data:
  ENVIRONMENT: "production"
  ALLOWED_ORIGINS: "https://app.example.com"
  NEXT_PUBLIC_API_URL: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: iterra-secrets
type: Opaque
stringData:
  # Replace every REPLACE_ME value via your secret store before applying.
  DATABASE_URL: "REPLACE_ME"          # postgresql://<user>:<password>@<host>:5432/<db>
  REDIS_URL: "REPLACE_ME"             # redis://<host>:6379/0
  CELERY_BROKER_URL: "REPLACE_ME"     # redis://<host>:6379/0
  CELERY_RESULT_BACKEND: "REPLACE_ME" # redis://<host>:6379/1
  SECRET_KEY: "REPLACE_ME"            # strong, unique; never the insecure default
  TOKEN_ENCRYPTION_KEY: "REPLACE_ME"  # dedicated Fernet key, separate from SECRET_KEY
