# Web (Next.js) deployment.
#
# Resource limits/requests (R12.3) and HTTP liveness/readiness probes against the
# Next.js server root (R12.4). Non-secret runtime config comes from
# `iterra-config`; nothing is hardcoded (R12.6).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iterra-web
  labels:
    app: iterra
    component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: iterra
      component: web
  template:
    metadata:
      labels:
        app: iterra
        component: web
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: web
          image: iterra/web:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: iterra-config
          env:
            - name: API_PROXY_TARGET
              value: "http://iterra-api:8000"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: iterra-web
  labels:
    app: iterra
    component: web
spec:
  selector:
    app: iterra
    component: web
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
